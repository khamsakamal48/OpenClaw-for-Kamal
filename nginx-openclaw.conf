# OpenClaw — Nginx reverse proxy configuration
#
# SETUP INSTRUCTIONS:
#
# Rocky Linux / RHEL / Fedora / AlmaLinux / CentOS:
#   sudo cp nginx-openclaw.conf /etc/nginx/conf.d/openclaw.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d openclaw.k-ai.in
#
# Ubuntu / Debian:
#   sudo cp nginx-openclaw.conf /etc/nginx/sites-available/openclaw.conf
#   sudo ln -s /etc/nginx/sites-available/openclaw.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d openclaw.k-ai.in
#
# NOTE: Deploy this HTTP-only config first and let certbot add the HTTPS block.
#       Do NOT pre-add ssl_certificate paths — certbot will manage them.
#
# Certbot install:
#   Rocky/RHEL:  sudo dnf install certbot python3-certbot-nginx
#   Ubuntu/Deb:  sudo apt install certbot python3-certbot-nginx

# ---- HTTP — certbot will convert this to an HTTPS redirect automatically ----
server {
    listen 80;
    listen [::]:80;
    server_name openclaw.k-ai.in;

    # ---- Proxy to OpenClaw gateway ----
    location / {
        proxy_pass http://127.0.0.1:18789;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for the control plane)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Timeouts — WebSocket connections are long-lived
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 60s;
    }

    # ---- Request size limit (adjust if sending large files via channels) ----
    client_max_body_size 50m;

    # ---- Logging ----
    access_log /var/log/nginx/openclaw.access.log;
    error_log  /var/log/nginx/openclaw.error.log;
}

# =============================================================================
# After running certbot, it will automatically insert an HTTPS server block
# below this line and update the HTTP block above to redirect to HTTPS.
# certbot also adds ssl_certificate, ssl_certificate_key, and include lines.
#
# The final HTTPS block will also include our security headers below — certbot
# preserves custom location{} directives. You can manually add these headers
# to the HTTPS server block certbot generates:
#
#     add_header X-Frame-Options        "SAMEORIGIN" always;
#     add_header X-Content-Type-Options "nosniff" always;
#     add_header X-XSS-Protection       "1; mode=block" always;
#     add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
# =============================================================================
