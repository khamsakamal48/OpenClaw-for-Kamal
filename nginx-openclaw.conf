# OpenClaw — Nginx reverse proxy configuration
# Place this file in /etc/nginx/sites-available/openclaw.conf
# Then enable:  sudo ln -s /etc/nginx/sites-available/openclaw.conf /etc/nginx/sites-enabled/
# Test config:  sudo nginx -t
# Reload:       sudo systemctl reload nginx
#
# Prerequisites:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d openclaw.k-ai.in

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name openclaw.k-ai.in;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — TLS termination + WebSocket proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openclaw.k-ai.in;

    # ---- TLS (managed by certbot — paths update automatically) ----
    ssl_certificate     /etc/letsencrypt/live/openclaw.k-ai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openclaw.k-ai.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers ----
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---- Proxy to OpenClaw gateway ----
    location / {
        proxy_pass http://127.0.0.1:18789;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for the control plane)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Timeouts — WebSocket connections are long-lived
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 60s;
    }

    # ---- Request size limit (adjust if sending large files via channels) ----
    client_max_body_size 50m;

    # ---- Logging ----
    access_log /var/log/nginx/openclaw.access.log;
    error_log  /var/log/nginx/openclaw.error.log;
}
